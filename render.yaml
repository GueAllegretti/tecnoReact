services:
  - type: web
    name: tecnopoint-backend
    env: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: cd api && gunicorn api.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: tecnopoint-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://tecnopoint.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: tecnopoint-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: tecnopoint-db
    plan: free
